# Deploy Frontend
#
# Builds the frontend and publishes it to S3 + CloudFront. Only triggers automatically
# when a push to main actually touches frontend/ — the `paths` filter below means GitHub
# Actions never even starts this job (no AWS calls, no build) for a backend-only or
# docs-only change, unlike deploy.yml's backend job which runs on every push to main.
# workflow_dispatch allows a manual one-off run (e.g. to verify AWS secrets) without
# needing a real frontend change to push.
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
